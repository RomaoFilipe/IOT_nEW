  landing:
    title: "Agricultura Inteligente"

    hero:
      highlight: "Agricultura Inteligente"
      continuation: "para un Futuro Sostenible"
      description: "Transforma tu explotación agrícola con nuestra plataforma IoT. Supervisa el suelo, automatiza el riego y toma decisiones basadas en datos."
      cta:
        get_started: "Comenzar Ahora"
        request_demo: "Solicitar Demostración"

    features:
      title: "Potentes Funcionalidades IoT"
      description: "Nuestra plataforma combina tecnología avanzada con conocimientos agrícolas para tomar decisiones informadas."
      items:
        - title: "Monitoreo Ambiental"
          desc: "Supervisa la temperatura, la humedad y el suelo en tiempo real con sensores de precisión."
        - title: "Riego Inteligente"
          desc: "Automatiza el riego según datos del suelo y previsiones meteorológicas."
        - title: "Predicción de Cosechas"
          desc: "Predice cosechas basadas en datos históricos y condiciones actuales."
        - title: "Conectividad de Campo"
          desc: "Conecta todos tus campos con una red mallada incluso en zonas remotas."
        - title: "Análisis Basado en Datos"
          desc: "Aprovecha la IA y el aprendizaje automático para obtener información útil."
        - title: "Acceso Móvil"
          desc: "Supervisa y controla todo desde tu móvil."

    how_it_works:
      title: "Cómo Funciona"
      description: "Nuestra plataforma agrícola IoT es fácil de configurar y potente de usar."
      items:
        deploy:
          icon: "🌱"
          title: "Instalar Sensores"
          desc: "Coloca sensores inteligentes para monitorear suelo, clima y salud de los cultivos."
        connect:
          icon: "☁️"
          title: "Conectar a la Plataforma"
          desc: "Los sensores se conectan automáticamente a la nube mediante red mallada."
        analyze:
          icon: "📊"
          title: "Analizar Datos"
          desc: "La plataforma analiza los datos recolectados y proporciona recomendaciones."
        implement:
          icon: "⚡"
          title: "Implementar Acciones"
          desc: "Aplica o automatiza acciones como riego basadas en datos en tiempo real."

    stats:
      description: "Únete a miles de agricultores que ya usan nuestra plataforma para optimizar la producción."
