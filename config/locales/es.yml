        title: "Acuicultura Marina"
        description: "Controla salinidad, temperatura y oxígeno en tiempo real."
      tank:
        title: "Acuicultura en Tanque"
        description: "Gestión inteligente de criaderos y tanques."
    how_it_works:
      title: "Cómo Funciona"
      description: "Descubre cómo nuestra solución se adapta a tu operación."
    testimonials:
      title: "Historias Reales, Resultados Reales"
      subtitle: "Cómo los clientes transforman sus explotaciones con tecnología inteligente."
