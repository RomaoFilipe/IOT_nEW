        quote: "Reducimos el consumo de agua un 35% con sensores de suelo conectados a nuestra cuenta AgriloT."
        name: "Marta Silva"
        role: "Productora de hortalizas"
      tiago:
        quote: "Con monitorización continua, los peces están más sanos y el oxígeno siempre en su punto."
        name: "Tiago Ramos"
        role: "Gestor de acuicultura en tanque"
      carlos:
        quote: "Evitamos un brote de algas gracias a una alerta de la plataforma. Ya no trabajo sin esto."
        name: "Carlos Fonseca"
        role: "Acuicultura marina"
    comparison:
      title: "Antes y Después de la Plataforma"
      subtitle: "Observa el impacto real de digitalizar tu explotación."
      before:
        emoji: "🌧"
        title: "Antes"
        items:
          - "Riego manual sin datos fiables"
          - "Desperdicio de agua y energía"
          - "Falta de alertas y previsiones"
          - "Decisiones por intuición"
      after:
        emoji: "☀️"
        title: "Después"
        items:
          - "Riego y alertas automatizados"
          - "Informes e historial en tiempo real"
          - "Mayor productividad con menos recursos"
          - "Decisiones basadas en datos"
    technologies:
      title: "Tecnología para Agro y Acuicultura"
      subtitle: "Integraciones y compatibilidad con estándares líderes."
      items:
        - "MQTT"
        - "LoRaWAN"
        - "Raspberry Pi"
        - "Tuya"
        - "API REST"
        - "Wi-Fi / BLE"
    cta_final:
      title: "¿Listo para transformar tu operación?"
      subtitle: "Crea tu cuenta gratuita y empieza a monitorizar y automatizar hoy."
      button: "Crear cuenta gratuita"
