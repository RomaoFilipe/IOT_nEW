        quote: "Reducimos el uso de agua un 35% usando sensores de suelo conectados a nuestra cuenta de AgriloT."
        name: "Marta Silva"
        role: "Productora de hortalizas"
      tiago:
        quote: "Con el monitoreo continuo, los peces están más sanos y el oxígeno siempre está en su punto."
        name: "Tiago Ramos"
        role: "Gestor de acuicultura en tanque"
      carlos:
        quote: "Evitamos un brote de algas gracias a una alerta de la plataforma. Ya no trabajo sin ella."
        name: "Carlos Fonseca"
        role: "Acuicultura marina"
    comparison:
      title: "Antes y después de la plataforma"
      subtitle: "Mira el impacto real de digitalizar tu operación."
