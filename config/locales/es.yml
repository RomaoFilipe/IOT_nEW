  landing:
    title: Agricultura Inteligente
    hero:
      highlight: Agricultura Inteligente
      continuation: para un Futuro Sostenible
      description: Transforma tus operaciones agrícolas con nuestra plataforma IoT. Supervisa el suelo, automatiza el riego y toma decisiones basadas en datos.
      cta:
        get_started: Empezar Ahora
        request_demo: Solicitar Demostración

    features:
      title: Funcionalidades IoT Potentes
      description: Nuestra plataforma combina tecnología de vanguardia con experiencia agrícola para ayudarte a tomar decisiones informadas.
      items:
        env_monitoring:
          title: Monitoreo Ambiental
          desc: Supervisa temperatura, humedad y condiciones del suelo en tiempo real con sensores de precisión.
        smart_irrigation:
          title: Riego Inteligente
          desc: Automatiza el riego según datos de humedad del suelo y previsiones meteorológicas.
        yield_forecasting:
          title: Predicción de Cosechas
          desc: Predice los rendimientos utilizando datos históricos, condiciones actuales y clima.
        field_connectivity:
          title: Conectividad de Campo
          desc: Conecta todos tus campos con nuestra red mesh resistente, incluso en zonas remotas.
        data_insights:
          title: Información Basada en Datos
          desc: Aprovecha la IA y el aprendizaje automático para obtener información práctica.
        mobile_access:
          title: Acceso Móvil
          desc: Supervisa y controla tu explotación desde cualquier lugar con nuestra interfaz móvil.

    how_it_works:
      title: Cómo Funciona
      description: Nuestra plataforma agrícola IoT está diseñada para ser fácil de instalar y poderosa de utilizar.
      items:
        deploy:
          icon: "🌱"
          title: Instalar Sensores
          desc: Coloca sensores inteligentes para monitorear el suelo, clima y salud del cultivo.
        connect:
          icon: "☁️"
          title: Conectar a la Plataforma
          desc: Los sensores se conectan automáticamente a la nube mediante nuestra red mesh.
        analyze:
          icon: "📊"
          title: Analizar Datos
          desc: Nuestra plataforma analiza los datos de tu explotación y proporciona información útil.
        implement:
          icon: "⚡"
          title: Implementar Acciones
          desc: Aplica o automatiza acciones como el riego en base a datos en tiempo real.

    stats:
      description: Únete a miles de agricultores que ya utilizan nuestra plataforma para optimizar su producción.
      water:
        value: "95%"
        label: Ahorro de Agua
      yield:
        value: "30%"
