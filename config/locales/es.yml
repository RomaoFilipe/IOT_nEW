  # --- Landing (página pública)
  landing:
    title: "Agricultura Inteligente"
    hero:
      title: "Agricultura Inteligente"
      description: "Transforma tu explotación con nuestra plataforma IoT. Monitorea el suelo, automatiza el riego y toma decisiones basadas en datos."
