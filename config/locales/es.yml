        emoji: "🌧"
        title: "Antes"
        items:
          - "Riego manual sin datos concretos"
          - "Desperdicio de agua y energía"
          - "Falta de alertas y previsiones"
          - "Decisiones basadas en la experiencia"
      after:
        emoji: "☀️"
        title: "Después"
        items:
          - "Automatización de riego y alertas"
          - "Informes e historial en tiempo real"
          - "Mayor productividad con menos recursos"
          - "Decisiones basadas en datos"
    technologies:
