          title: "Sensores de campo"
          desc: "Humedad del suelo, temperatura del aire y calidad del suelo."
      sea:
        step1:
          title: "Monitoreo marino"
          desc: "Oxígeno, salinidad y temperatura del agua de mar."
      tank:
        step1:
          title: "Gestión de tanques"
          desc: "Sensores de criadero, alertas e informes detallados."
      common:
        step2:
          title: "Analítica inteligente"
          desc: "Gráficos, pronósticos y alertas en tiempo real."
        step3:
          title: "Acciones automatizadas"
          desc: "Riego, ventilación y notificaciones."
