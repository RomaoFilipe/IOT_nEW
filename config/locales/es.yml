  landing:
    title: Agricultura Inteligente
    hero:
      highlight: Agricultura Inteligente
      continuation: para un Futuro Sostenible
      description: Transforma tu explotación agrícola con nuestra plataforma IoT. Supervisa el suelo, automatiza el riego y toma decisiones basadas en datos.
      cta:
        get_started: Empezar Ahora
        request_demo: Solicitar Demostración

    features:
      title: Funcionalidades Potentes de IoT
      description: Combinamos tecnología avanzada con conocimiento agrícola para decisiones más inteligentes.
      items:
        env_monitoring:
          title: Monitoreo Ambiental
          desc: Controla la temperatura, humedad y condiciones del suelo en tiempo real.
        smart_irrigation:
          title: Riego Inteligente
          desc: Automatiza el riego según la humedad del suelo y el pronóstico del tiempo.
        yield_forecasting:
          title: Predicción de Cosechas
          desc: Estima las producciones con datos históricos y condiciones actuales.
        field_connectivity:
          title: Conectividad de Campo
          desc: Conecta todos tus campos incluso en zonas remotas con nuestra red mallada.
        data_insights:
          title: Análisis Basado en Datos
          desc: Utiliza IA y aprendizaje automático para obtener información útil de tus datos agrícolas.
        mobile_access:
          title: Acceso Móvil
          desc: Supervisa y controla tu granja desde cualquier lugar con nuestra interfaz móvil.

    how_it_works:
      title: Cómo Funciona
      description: Nuestra plataforma IoT agrícola es fácil de instalar y muy potente de usar.
      items:
        deploy:
          icon: "🌱"
          title: Instalar Sensores
          desc: Coloca sensores inteligentes para monitorear el suelo, clima y cultivos.
        connect:
          icon: "☁️"
          title: Conectar a la Plataforma
          desc: Los sensores se conectan automáticamente a la nube mediante tecnología mesh.
        analyze:
          icon: "📊"
          title: Analizar Datos
          desc: La plataforma interpreta los datos agrícolas y sugiere acciones eficaces.
        implement:
          icon: "⚡"
          title: Implementar Acciones
          desc: Aplica o automatiza procesos como el riego en tiempo real.

    stats:
      description: Únete a miles de agricultores que ya utilizan nuestra plataforma para optimizar sus operaciones.
      water:
        value: "95%"
        label: Ahorro de Agua
      yield:
        value: "30%"
