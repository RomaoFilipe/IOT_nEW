        quote: "Reducimos el consumo de agua en un 35% con sensores de suelo conectados a nuestra cuenta AgriloT."
        name: "Marta Silva"
        role: "Productora de hortalizas"
      tiago:
        quote: "Gracias a la monitorización continua, los peces están más saludables y el oxígeno siempre está en su punto."
        name: "Tiago Ramos"
        role: "Gestor de acuicultura en tanque"
