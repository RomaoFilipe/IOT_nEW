        get_started: "Começar Agora"
        request_demo: "Pedir Demonstração"

    features:
      title: "Funcionalidades Poderosas de IoT"
      description: "A nossa plataforma combina tecnologia de ponta com conhecimento agrícola para decisões informadas."
      items:
        env_monitoring:
          title: "Monitorização Ambiental"
          desc: "Acompanha temperatura, humidade e solo em tempo real com sensores de precisão."
        smart_irrigation:
          title: "Rega Inteligente"
          desc: "Automatiza a rega com base em dados do solo e previsões meteorológicas."
        yield_forecasting:
          title: "Previsão de Colheitas"
          desc: "Prevê colheitas com base em dados históricos e condições atuais."
        field_connectivity:
          title: "Conectividade de Campo"
          desc: "Liga todos os campos com rede mesh mesmo em zonas remotas."
        data_insights:
          title: "Análises Baseadas em Dados"
          desc: "Tira partido da IA e machine learning para obter insights valiosos."
        mobile_access:
          title: "Acesso Móvel"
          desc: "Monitoriza e controla tudo a partir do teu telemóvel."

    how_it_works:
      title: "Como Funciona"
      description: "A nossa plataforma agrícola IoT é fácil de configurar e poderosa de utilizar."
      items:
        deploy:
          icon: "🌱"
          title: "Instalar Sensores"
          desc: "Coloca sensores inteligentes para monitorizar solo, clima e saúde das plantas."
        connect:
          icon: "☁️"
          title: "Conectar à Plataforma"
          desc: "Os sensores ligam-se automaticamente à cloud através de rede mesh."
        analyze:
          icon: "📊"
          title: "Analisar Dados"
          desc: "A plataforma analisa os dados recolhidos e fornece recomendações."
        implement:
          icon: "⚡"
          title: "Implementar Ações"
          desc: "Aplica ou automatiza ações como rega com base em dados em tempo real."

