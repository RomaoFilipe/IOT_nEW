        quote: "Evitámos um surto de algas graças a um alerta da plataforma. Nunca mais trabalho sem isto."
        name: "Carlos Fonseca"
        role: "Aquacultura marinha"
    comparison:
      title: "Antes e Depois da Plataforma"
      subtitle: "Vê o impacto real da digitalização da tua exploração."
