        role: "Produtora de hortícolas"
      tiago:
        quote: "Com monitorização contínua, os peixes estão mais saudáveis e o oxigénio está sempre no ponto."
        name: "Tiago Ramos"
        role: "Gestor de aquacultura em tanque"
