        title: "Agriculture"
        description: "Monitor soil, automate irrigation, and maximize yield."
      sea:
        title: "Marine Aquaculture"
        description: "Control salinity, temperature, and oxygen in real time."
      tank:
        title: "Tank Aquaculture"
        description: "Smart management for hatcheries and tanks."

    how_it_works:
      title: "How It Works"
      description: "See how our solution adapts to your operation."
      agriculture:
        step1:
          title: "Field sensors"
          desc: "Soil moisture, air temperature and soil quality."
      sea:
        step1:
          title: "Marine monitoring"
          desc: "Oxygen, salinity and seawater temperature."
      tank:
        step1:
          title: "Tank management"
          desc: "Hatchery sensors, alerts and detailed reports."
      common:
        step2:
          title: "Smart analytics"
          desc: "Charts, forecasts and real-time alerts."
        step3:
          title: "Automated actions"
          desc: "Irrigation, ventilation and notifications."

    testimonials:
      title: "Real Stories, Real Results"
      subtitle: "How customers are transforming their operations with smart tech."
      marta:
        quote: "We reduced water usage by 35% using soil sensors connected to our AgriloT account."
        name: "Marta Silva"
        role: "Vegetable grower"
      tiago:
        quote: "With continuous monitoring, the fish are healthier and oxygen is always on point."
        name: "Tiago Ramos"
        role: "Tank aquaculture manager"
      carlos:
        quote: "We avoided an algae outbreak thanks to the platform alert. I'll never work without it."
        name: "Carlos Fonseca"
        role: "Marine aquaculture"

    comparison:
      title: "Before and After the Platform"
      subtitle: "See the real impact of digitizing your operation."
      before:
        emoji: "🌧"
        title: "Before"
        items:
          - "Manual irrigation without solid data"
          - "Waste of water and energy"
          - "Lack of alerts and forecasts"
          - "Decisions based on intuition"
      after:
        emoji: "☀️"
        title: "After"
        items:
          - "Automated irrigation and alerts"
          - "Real-time reports and history"
          - "Higher productivity with fewer resources"
          - "Data-driven decisions"

    technologies:
      title: "Technology that Powers Ag & Aquaculture"
      subtitle: "Integrations and compatibility with industry-leading standards."
      items:
