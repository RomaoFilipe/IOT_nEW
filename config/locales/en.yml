  landing:
    title: Smart Farming
    hero:
      highlight: Smart Farming
      continuation: for a Sustainable Future
      description: Transform your agricultural operations with our IoT platform. Monitor soil, automate irrigation, and make data-driven decisions.
      cta:
        get_started: Get Started
        request_demo: Request Demo

    features:
      title: Powerful IoT Features
      description: We combine cutting-edge technology with agricultural expertise for smarter decisions.
      items:
        env_monitoring:
          title: Environmental Monitoring
          desc: Monitor temperature, humidity, and soil in real-time with precision sensors.
        smart_irrigation:
          title: Smart Irrigation
          desc: Automate irrigation based on soil moisture and weather forecasts.
        yield_forecasting:
          title: Yield Forecasting
          desc: Estimate production using historical data, current conditions, and forecasts.
        field_connectivity:
          title: Field Connectivity
          desc: Connect all your fields even in remote areas with our resilient mesh network.
        data_insights:
          title: Data-Driven Insights
          desc: Use AI and machine learning to gain actionable insights from your farm data.
        mobile_access:
          title: Mobile Access
          desc: Monitor and control your farm remotely with our mobile-friendly interface.

    how_it_works:
      title: How It Works
      description: Our agricultural IoT platform is easy to set up and powerful to use.
      items:
        deploy:
          icon: "🌱"
          title: Deploy Sensors
          desc: Place smart sensors across your land to monitor soil, weather, and crop health.
        connect:
          icon: "☁️"
          title: Connect to Platform
          desc: Sensors automatically connect to the cloud through mesh network technology.
        analyze:
          icon: "📊"
          title: Analyze Data
          desc: The platform analyzes farm data and provides actionable recommendations.
        implement:
          icon: "⚡"
          title: Implement Actions
          desc: Apply or automate irrigation and more based on real-time insights.

