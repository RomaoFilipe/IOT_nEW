  # --- Landing (public home)
  landing:
    title: "Smart Agriculture"
    hero:
      title: "Smart Agriculture"
      description: "Transform your operation with our IoT platform. Monitor soil, automate irrigation, and make data-driven decisions."
      cta:
        get_started: "Get Started"

    trust_bar:
