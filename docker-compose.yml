services:
  db:
    image: postgres:14
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin123
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: IOT_development
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  sensor_simulator:
    build:
      context: .
      dockerfile: Dockerfile.sensor
    environment:
      API_TOKEN: abc123supersecreto
    restart: unless-stopped
    depends_on:
      - db

  sensor_gateway:
    build:
      context: ./sensor_gateway
      dockerfile: Dockerfile.gateway
    env_file: .env
    environment:
      API_TOKEN: abc123supersecreto
      API_URL: http://host.docker.internal:3000/api/sensors
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
    depends_on:
      - mqtt
    restart: unless-stopped

  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    volumes:
      - .:/app
      - ./vendor/bundle:/usr/local/bundle
    environment:
      TZ: Europe/Lisbon
      RAILS_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DATABASE_URL: postgres://admin123:admin123@db:5432/IOT_development
    depends_on:
      - db
      - mqtt
    restart: unless-stopped


  mqtt:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

volumes:
  postgres_data:
